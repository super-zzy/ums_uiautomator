<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>脚本录制 - Android UI 自动化测试平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        success: '#00B42A',
                        warning: '#FF7D00',
                        danger: '#F53F3F',
                        dark: '#1D2129',
                        light: '#86909C'
                    },
                    fontFamily: {
                        inter: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .card-shadow {
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            }
            .btn-hover {
                @apply transition-all duration-300 hover:shadow-lg transform hover:-translate-y-0.5;
            }
        }
    </style>
</head>
<body class="font-inter bg-gray-50 text-dark min-h-screen flex flex-col">
    <!-- 顶部导航 -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa fa-android text-primary text-2xl"></i>
                <h1 class="text-xl md:text-2xl font-bold text-primary">脚本录制</h1>
            </div>
            <div class="flex items-center space-x-3 text-sm">
                <a href="/home" class="text-light hover:text-primary flex items-center">
                    <i class="fa fa-home mr-1"></i> 首页
                </a>
                <a href="/autotest" class="text-light hover:text-primary flex items-center">
                    <i class="fa fa-list-alt mr-1"></i> 自动化测试
                </a>
            </div>
        </div>
    </header>

    <!-- 主内容 -->
    <main class="flex-grow container mx-auto px-4 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-4">
            <!-- 左侧：在线设备 -->
            <div class="lg:col-span-1 space-y-4">
                <div class="bg-white rounded-lg p-5 card-shadow">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-semibold flex items-center">
                            <i class="fa fa-mobile text-primary mr-2"></i>在线设备
                        </h2>
                        <button id="refresh-device-btn" class="text-primary text-sm flex items-center hover:text-primary/80">
                            <i class="fa fa-refresh mr-1"></i>刷新
                        </button>
                    </div>
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm text-light">在线设备数</span>
                        <span id="online-device-count" class="text-xl font-bold">0</span>
                    </div>
                    <div id="device-list" class="space-y-3 max-h-[460px] overflow-y-auto pr-2">
                        <div class="text-center text-light py-8">
                            <i class="fa fa-spinner fa-spin text-2xl mb-2"></i>
                            <p>加载设备中...</p>
                        </div>
                    </div>
                </div>

                <!-- 简要说明 -->
                <div class="bg-white rounded-lg p-4 card-shadow">
                    <h3 class="text-sm font-semibold mb-2 flex items-center">
                        <i class="fa fa-info-circle text-primary mr-2"></i> 使用说明
                    </h3>
                    <ol class="list-decimal list-inside text-xs text-light space-y-1">
                        <li>在左侧选择一个在线设备。</li>
                        <li>点击“开始录制”，等待下方屏幕实时预览。</li>
                        <li>在屏幕区域用鼠标点击，系统会同步操作设备并记录动作。</li>
                        <li>点击“停止录制”生成 Python 脚本，可在右侧编辑后保存为用例。</li>
                    </ol>
                </div>
            </div>

            <!-- 右侧：录制区域 -->
            <div class="lg:col-span-2 space-y-4">
                <!-- 录制控制 + 屏幕预览 -->
                <div class="bg-white rounded-lg p-5 card-shadow">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-semibold flex items-center">
                            <i class="fa fa-circle-o-notch text-primary mr-2"></i>录制控制
                        </h2>
                    </div>
                    <div class="flex flex-wrap gap-3 mb-4">
                        <button id="record-start-btn" class="bg-success text-white px-4 py-2 rounded-lg flex items-center btn-hover">
                            <i class="fa fa-circle mr-2"></i>开始录制
                        </button>
                        <button id="record-stop-btn" class="bg-warning text-white px-4 py-2 rounded-lg flex items-center btn-hover disabled:opacity-50">
                            <i class="fa fa-stop mr-2"></i>停止录制
                        </button>
                        <button id="record-save-btn" class="bg-primary text-white px-4 py-2 rounded-lg flex items-center btn-hover disabled:opacity-50">
                            <i class="fa fa-save mr-2"></i>保存为用例
                        </button>
                    </div>
                    <div class="border border-gray-200 rounded-lg overflow-hidden bg-black flex items-center justify-center">
                        <img
                            id="record-screen"
                            alt="录制屏幕"
                            class="max-h-[420px] w-full object-contain cursor-crosshair select-none"
                            draggable="false"
                        >
                    </div>
                </div>

                <!-- 生成脚本编辑区 -->
                <div class="bg-white rounded-lg p-5 card-shadow">
                    <h2 class="text-lg font-semibold mb-4 flex items-center">
                        <i class="fa fa-file-code-o text-primary mr-2"></i>生成的 Python 脚本
                    </h2>
                    <div class="mb-3">
                        <label class="block text-sm font-medium mb-1">用例文件名 (.py)</label>
                        <input id="record-name" type="text" class="w-full px-3 py-2 border rounded text-sm" placeholder="例如：record_login_case">
                    </div>
                    <div class="flex flex-col">
                        <textarea id="record-code" class="w-full px-3 py-2 border rounded font-mono text-xs" style="min-height: 260px; resize: vertical;" placeholder="停止录制后，这里会自动生成示例脚本，您也可以在保存前自行编辑..."></textarea>
                    </div>
                </div>

                <!-- 简单任务日志 -->
                <div class="bg-white rounded-lg p-5 card-shadow">
                    <h2 class="text-lg font-semibold mb-3 flex items-center">
                        <i class="fa fa-commenting text-primary mr-2"></i>录制日志
                    </h2>
                    <div id="task-log" class="w-full h-[160px] border border-gray-200 rounded-lg p-3 overflow-y-auto bg-gray-50 text-xs">
                        <p class="text-light italic">等待录制开始...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-white border-t border-gray-200 py-4">
        <div class="container mx-auto px-4 text-center text-light text-xs md:text-sm">
            <p>© 2025 Android UI 自动化测试平台 | 设计与开发：zyli3</p>
        </div>
    </footer>

    <!-- JS：复用通用模块 + 设备列表 + 日志 + 录制逻辑 -->
    <script src="/static/js/common.js"></script>
    <script src="/static/js/task_log.js"></script>
    <script src="/static/js/devices.js"></script>
    <script src="/static/js/record.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        // 初始化设备模块与录制模块
        window.Devices && window.Devices.initDevices();
        window.Devices && window.Devices.loadDeviceList();
        window.Record && window.Record.initRecordUI();
      });
    </script>
</body>
</html>
